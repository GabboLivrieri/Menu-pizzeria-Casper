<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casper · Menù</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
:root{--g:#14502f;--r:#8a1c1c;--bg:#d9e0db}
@media(prefers-color-scheme:dark){:root{--bg:#0d1912}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at center,var(--bg),#00000030 140%),var(--bg);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#book{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;width:96vw;height:78vh;max-width:1000px}
.page{container-type:inline-size;overflow:hidden;color:#2a2418;background:
 repeating-linear-gradient(0deg,#0000 0 3px,#8a6d2a07 3px 4px),
 linear-gradient(100deg,#f3ead2,#fbf6e6 12%,#faf3df 88%,#eee2c3)}
.in{padding:0 4.5cqw;height:100%;position:relative}
.page h2{background:linear-gradient(#1a6a3f,#0f4126);color:#fff;text-align:center;letter-spacing:.16em;text-transform:uppercase;font-size:4.2cqw;font-weight:600;margin:5cqw -4.5cqw 3cqw;padding:2.2cqw;box-shadow:0 .6cqw 1cqw #0003}
.it{display:flex;justify-content:space-between;gap:2.5cqw;padding:1.5cqw 0;border-bottom:.3cqw dotted #5a4a2a55;opacity:0;animation:in .6s forwards}
.it b{font-weight:600;font-size:3.75cqw}.it small{display:block;color:#6a5d44;font-size:3cqw;font-style:italic;line-height:1.25}
.it span{white-space:nowrap;font-weight:700;color:var(--g);font-size:3.75cqw}
.note{color:var(--r);font-size:3.2cqw;margin:3cqw 0}
.pn{position:absolute;bottom:2.5cqw;left:0;right:0;text-align:center;font-size:2.8cqw;color:#8a7a55}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hard{background:radial-gradient(circle at 50% 35%,#fffdf5,#efe6cc);border:0}
.cv{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1.6cqw solid #14502f;outline:.5cqw solid #c9a24a;outline-offset:-3.2cqw}
.cv h1{font-size:15cqw;margin:0;color:var(--r);font-style:italic}
.cv p{margin:1cqw;color:var(--g);font-size:3.8cqw;letter-spacing:.08em}
.hint{margin-top:6cqw;font-size:3.2cqw!important;color:#777!important;animation:bl 1.8s infinite}
@keyframes bl{50%{opacity:.25}}
.gh{animation:fl 3.2s ease-in-out infinite;width:42cqw;height:auto}
@keyframes fl{50%{transform:translateY(-3.5cqw) rotate(3deg)}}
.pz{animation:sp 8s linear infinite;transform-origin:150px 38px}
@keyframes sp{to{transform:rotate(360deg)}}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto;max-width:96vw;padding:3px}
nav button{border:0;background:var(--g);color:#fff;border-radius:16px;padding:7px 13px;font-size:13px;white-space:nowrap;opacity:.55;font-family:inherit;transition:.3s}
nav button.on{opacity:1;transform:scale(1.07)}

.cats{margin-top:2cqw}
.cat{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;border-bottom:.3cqw dotted #5a4a2a55;padding:3.6cqw 1cqw;font:600 5cqw Georgia,'Times New Roman',serif;color:#2a2418;cursor:pointer;text-align:left}
.cat i{font-style:normal;color:var(--g);font-size:6cqw}
.cat:hover,.cat:active{background:#14502f18}
nav button.hb{background:var(--r);opacity:1}

/* ===== restyling elegante ===== */
:root{--gold:#c9a24a;--ink:#2a2418;--fh:'Playfair Display',Georgia,serif;--fb:'Cormorant Garamond',Georgia,serif}
html,body{font-family:var(--fb)}
#book{filter:drop-shadow(0 2.5vh 4vh #0005)}
.page{background:linear-gradient(100deg,#f4ecd6,#fcf8ea 10%,#fbf6e6 90%,#efe4c6)}
.page.hard{background:radial-gradient(circle at 50% 35%,#fffdf5,#efe6cc)}
.page h2{font:600 4cqw var(--fh);letter-spacing:.22em;padding:2.2cqw;box-shadow:0 .6cqw 1.2cqw #0003,inset 0 .35cqw 0 #c9a24a66,inset 0 -.35cqw 0 #c9a24a66}
.it{align-items:baseline;border-bottom:.25cqw solid #8a6d2a26}
.it b{font:700 4.3cqw/1.2 var(--fb);color:var(--ink);letter-spacing:.01em}
.it small{font:italic 500 3.4cqw/1.25 var(--fb);color:#6a5d44}
.it span{font:700 4.3cqw var(--fb);font-variant-numeric:lining-nums tabular-nums}
.note{font:italic 600 3.5cqw var(--fb)}
.pn{font:500 3cqw var(--fh);letter-spacing:.2em;color:var(--gold)}
.cv{position:relative}
.cv::before{content:"";position:absolute;inset:4.6cqw;border:.3cqw solid var(--gold);pointer-events:none}
.cv h1{font:italic 700 16cqw/1 var(--fh)}
.cv p{font:600 3.3cqw var(--fb);letter-spacing:.2em}
.cv h1+hr+p{font-size:3.1cqw;letter-spacing:.26em}
.cv h1+p{font:italic 500 4.3cqw/1.5 var(--fb);letter-spacing:.02em;padding:0 10cqw;margin-top:4cqw}
.orn{width:30cqw;height:.4cqw;border:0;margin:3cqw 0 2.5cqw;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hint{font:italic 500 3.6cqw var(--fb)!important;letter-spacing:.06em!important}
.cats{margin-top:1cqw}
.cat{font:600 5cqw var(--fh);gap:2.5cqw;padding:3.1cqw 1cqw;border-bottom:.25cqw solid #8a6d2a2a;opacity:0}
.cat{animation:in .5s forwards;animation-delay:calc(.35s + var(--n)*.06s)}
.cat i{font:600 4cqw var(--fb)!important;color:var(--g)}
.cat em{font:600 3.4cqw var(--fb);font-style:normal;color:var(--gold);letter-spacing:.1em;width:6cqw}
.cat span{flex:1}
.cat small{font:italic 500 3.3cqw var(--fb);color:#6a5d44}
nav{background:#ffffff40;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #ffffff55;border-radius:30px;padding:5px;margin-top:14px;box-shadow:0 4px 14px #0002;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:var(--g);opacity:.85;font:600 15px var(--fb);letter-spacing:.05em;padding:7px 15px;transform:none}
nav button.on{background:var(--g);color:#fff;opacity:1;transform:none}
nav button.hb{background:var(--r);color:#fff;opacity:1}
@media(prefers-color-scheme:dark){nav{background:#ffffff14;border-color:#ffffff22}nav button{color:#cfe4d6}nav button.on{color:#fff}}
#lang{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:30;display:flex;gap:2px;padding:4px;border-radius:20px;background:#ffffff40;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 3px 10px #0002}
#lang button{border:0;background:transparent;color:var(--g);font:700 13px var(--fb);letter-spacing:.08em;padding:5px 11px;border-radius:16px;cursor:pointer}
#lang button.on{background:var(--g);color:#fff}
@media(prefers-color-scheme:dark){#lang{background:#ffffff14}#lang button{color:#cfe4d6}#lang button.on{color:#fff}}
/* ===== menù a sezioni ===== */
#stage{width:100%;display:flex;justify-content:center}
#book{animation:pop .4s ease both}@keyframes pop{from{opacity:0}}
#book.hm{touch-action:pan-y;cursor:auto;user-select:auto;-webkit-user-select:auto;display:flex;justify-content:center}
#book.hm .page{width:min(100%,470px);height:100%}
.home .cv{justify-content:flex-start;padding:6cqw 9cqw 4cqw;overflow-y:auto;scrollbar-width:none}
.home .cv h1{font-size:11cqw}
.home .cv p.pick{font:italic 500 3.8cqw var(--fb);letter-spacing:.04em;margin:3.5cqw 0 1cqw;color:#6a5d44}
.home .cats{width:100%}
.home .cat{font-size:4.4cqw;padding:2.4cqw 1cqw}
.go{border:.3cqw solid var(--gold);background:none;color:var(--g);font:600 4cqw var(--fb);letter-spacing:.12em;padding:2cqw 6cqw;border-radius:6cqw;margin-top:7cqw;cursor:pointer}
.go:hover,.go:active{background:#14502f18}

.cvimg{display:block;width:100%;height:100%;object-fit:contain}
.chint{position:absolute;left:0;right:0;bottom:1.1%;margin:0;text-align:center;font:italic 500 3.1cqw var(--fb);letter-spacing:.06em;color:#f3ead2;animation:bl 1.8s infinite;pointer-events:none}
.logo{width:80cqw;max-width:100%;height:auto;mix-blend-mode:multiply;margin-top:-1cqw}
.home .cv p.pick{margin-top:1cqw}
.story{justify-content:space-between;padding:6cqw 9cqw 6.5cqw}
.story .logo{width:58cqw;margin:0}
.story h2{align-self:stretch;margin:0 -9cqw;font-size:6.2cqw;letter-spacing:.42em;padding:2cqw 0 2cqw .42em}
.story h3{font:600 3.7cqw var(--fh);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);margin:0}
.story .tx p{font:500 3.35cqw/1.3 var(--fb);letter-spacing:0;color:#3a3020;margin:0 0 2.1cqw;text-align:center}
.story .ico{width:34cqw;mix-blend-mode:multiply;margin:0}
.story .hint{margin:0!important}
.home .cats{margin-bottom:3cqw}
.home .cv{padding-bottom:8.5cqw}
.story h2{margin:0 -3.5cqw}
#book.hm .page{width:min(100%,470px,50vh)}
.home .logo{width:56cqw}
.home .cat{padding:2cqw 1cqw}
.cop{padding:1.4cqw 4cqw}
.cop{margin-top:auto;align-self:stretch;text-align:center;border:.3cqw solid var(--gold);border-radius:1.5cqw;background:#c9a24a1f;color:var(--r);font:italic 700 4.6cqw var(--fb);letter-spacing:.06em;padding:1.8cqw 4cqw;opacity:0;animation:in .5s forwards;animation-delay:calc(.35s + var(--n)*.06s)}
</style></head><body>

// impagina SOLO la sezione scelta (le "Pizze 1/2/3" diventano un'unica sezione Pizze)
function paginate(t){
 const pages=[];let cur=null,prev=null;
 const np=()=>{cur={h:"",y:0};pages.push(cur)};
 const hd=s=>{cur.h+=`<h2>${s}</h2>`;cur.y+=HH};
 blocks.filter(b=>b.t===t).forEach(b=>{
  const same=b.h===prev;prev=b.h;let k=0;
  while(k<b.i.length){const a=b.i[k];
   if(!cur)np();
   if(k===0&&!same){if(cur.y+HH+rowH(a)>B)np();hd(b.h)}
   else if(cur.y+rowH(a)>B){np();hd(b.h+tr(" (segue)"))}
   cur.h+=`<div class="it" style="animation-delay:${.35+(cur.y/B)*.4}s"><div><b>${a[0]}</b>${a[1]?`<small>${a[1]}</small>`:""}</div><span>${fmt(a[2])}</span></div>`;cur.y+=rowH(a);k++}
  if(b.note){if(cur.y+NH>B)np();cur.h+=`<p class="note">${b.note}</p>`;cur.y+=NH}
 });
 return pages}
